name = "aiko"
main = "api/index.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[build]
command = "npm run build"

[vars]
APP_URL = "https://aiko.todadjp.workers.dev"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AikoGuestAuthority"]

[[migrations]]
tag = "v2"
deleted_classes = ["AikoGuestAuthority"]
