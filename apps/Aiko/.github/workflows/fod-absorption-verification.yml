name: FOD Absorption Verification

on:
  push:
    branches: ["test/fod-absorption-regression-gates"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --include=optional
      - name: TypeScript and lint
        id: lint
        if: always()
        continue-on-error: true
        run: npm run lint
      - name: Canonical environment contract
        id: environment
        if: always()
        continue-on-error: true
        run: npm run test:system-env
      - name: Unit and integration tests
        id: integration
        if: always()
        continue-on-error: true
        run: npm run test:integration
      - name: Architecture regression gates before build
        id: architecture_pre
        if: always()
        continue-on-error: true
        run: npm run test:architecture
      - name: Fullstack production build
        id: fullstack
        if: always()
        continue-on-error: true
        run: npm run build:fullstack
      - name: API production build
        id: api
        if: always()
        continue-on-error: true
        run: npm run build:api
      - name: Architecture regression gates against built artifacts
        id: architecture_post
        if: always()
        continue-on-error: true
        run: npm run test:architecture
      - name: Skipo deployment validator
        id: deployment
        if: always()
        continue-on-error: true
        run: python3 checklists/aiko_skipo_validator.py .
      - name: Verification summary
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          LINT: ${{ steps.lint.outcome }}
          ENVIRONMENT: ${{ steps.environment.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
          ARCHITECTURE_PRE: ${{ steps.architecture_pre.outcome }}
          FULLSTACK: ${{ steps.fullstack.outcome }}
          API: ${{ steps.api.outcome }}
          ARCHITECTURE_POST: ${{ steps.architecture_post.outcome }}
          DEPLOYMENT: ${{ steps.deployment.outcome }}
        run: |
          failed=0
          for name in INSTALL LINT ENVIRONMENT INTEGRATION ARCHITECTURE_PRE FULLSTACK API ARCHITECTURE_POST DEPLOYMENT; do
            value="$(printenv "$name")"
            printf '%s: %s\n' "$name" "$value"
            if [[ "$value" != "success" ]]; then failed=1; fi
          done
          if [[ "$failed" -eq 0 ]]; then
            echo "FOD_ABSORPTION_VERIFICATION=PASS"
          else
            echo "FOD_ABSORPTION_VERIFICATION=FAIL"
            exit 1
          fi
