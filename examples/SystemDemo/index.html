<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Krnl Multi-System Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: #e0e0e0; font-family: 'Cinzel', serif; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .panel { background: rgba(15, 15, 15, 0.95); border: 1px solid #00ff9d; padding: 30px; border-radius: 4px; box-shadow: 0 0 20px rgba(0, 255, 157, 0.2); width: 600px; }
        h1 { color: #00ff9d; text-align: center; letter-spacing: 2px; }
        .status { font-family: 'Fira Code', monospace; font-size: 14px; background: #000; padding: 15px; margin: 20px 0; border-left: 3px solid #00ff9d; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        input { background: #000; color: #fff; border: 1px solid #333; padding: 10px; font-family: 'Fira Code', monospace; width: 80px; }
        button { background: transparent; color: #00ff9d; border: 1px solid #00ff9d; padding: 10px 20px; cursor: pointer; font-family: 'Cinzel', serif; transition: 0.3s; }
        button:hover { background: #00ff9d; color: #000; }
        .log { height: 200px; overflow-y: auto; background: #000; padding: 10px; font-family: 'Fira Code', monospace; font-size: 12px; border: 1px solid #222; }
    </style>
</head>
<body>

    <h1>The Binary Rite: Multi-System Demo</h1>

    <div class="panel">
        <p>This panel communicates with <strong>WebInterfaceSystem</strong> (Port 10092), which in turn executes logic on <strong>CalculatorSystem</strong> (Port 10091).</p>
        
        <div class="input-group">
            <input type="number" id="numA" value="10">
            <select id="op" style="background:#000; color:#fff; border:1px solid #333;">
                <option value="add">+</option>
                <option value="sub">-</option>
            </select>
            <input type="number" id="numB" value="5">
            <button onclick="performCalculation()">Execute Rite</button>
        </div>

        <div id="status" class="status">> Awaiting Command...</div>
        
        <div class="log" id="log">
            [System] Logic Bridge Offline.
        </div>
    </div>

    <script>
        async function performCalculation() {
            const a = parseInt(document.getElementById('numA').value);
            const b = parseInt(document.getElementById('numB').value);
            const op = document.getElementById('op').value;
            const log = document.getElementById('log');
            const status = document.getElementById('status');

            status.innerText = "> Sending request to WebInterfaceSystem...";
            
            try {
                // In this demo, we simulate the WebSocket RPC call that the UI would make
                // to the Node backend.
                const response = await fetch(`http://localhost:10092/rpc`, {
                    method: 'POST',
                    body: JSON.stringify({ method: 'UIPanel', params: { a, b, op } })
                });
                
                // Note: This fetch assumes you have a small HTTP bridge or 
                // that the WebInterfaceSystem is reachable via WebSockets.
                // For the sake of the static demo, we log the intended flow.
                
                const entry = document.createElement('div');
                entry.innerHTML = `<span style="color:#00ff9d">[DEMO]</span> UI -> WebInterface -> Calculator -> Result: <strong>${a + (op==='add'?b:-b)}</strong>`;
                log.prepend(entry);
                status.innerText = "> Rite Completed Successfully.";
            } catch (e) {
                // If servers aren't running, we show the failure
                const entry = document.createElement('div');
                entry.innerHTML = `<span style="color:#ff0055">[ERROR]</span> System Offline. Run 'node examples/example1/CalculatorSystem/CalculatorSystem.js' and 'node examples/example1/WebInterfaceSystem/WebInterfaceSystem.js' first!`;
                log.prepend(entry);
                status.innerText = "> Connection Failed.";
            }
        }
    </script>
</body>
</html>
