syntax = "proto3";

package krnl;

enum MessageKind {
  UNKNOWN = 0;
  REGISTER_INGRESS = 1;
  ROUTE_DATA = 2;
  RPC_REQUEST = 3;
  RPC_RESPONSE = 4;
  INTROSPECT = 5;
  INTROSPECT_RESPONSE = 6;
}

message KrnlMessage {
  MessageKind kind = 1;
  string routeId = 2;
  string requestId = 3;
  string traceCorrelationId = 4;
  string originSystemAddress = 5;
  int64 timestamp = 6;
  string method = 7;
  string collectorName = 8;
  
  // Payloads can be JSON-serialized strings inside binary, or any other bytes.
  // Using string for parameters to easily pass arbitrary structured data if needed,
  // or binary bytes. Let's provide both or standard fields.
  string jsonPayload = 9;
  bytes binaryPayload = 10;
}

message RpcResponse {
  string requestId = 1;
  bool ok = 2;
  string error = 3;
  string jsonResult = 4;
  string errorDocumentation = 5;
}
