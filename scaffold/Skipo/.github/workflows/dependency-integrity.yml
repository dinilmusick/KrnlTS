name: Downstream dependency integrity
on:
  pull_request:
    paths:
      - 'package.json'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'package-lock.json'
      - 'scaffolds/**'
      - 'tests/**'
      - '.github/workflows/dependency-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downstream-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Frozen dependency installation
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Install Python test runner
        run: python3 -m pip install pytest
      - name: Test
        run: pnpm run test
      - name: Typecheck
        run: pnpm run typecheck
