name: Skipo Framework

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
        default: check

permissions:
  contents: write
  pull-requests: write

jobs:
  skipo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
      - name: Checkout Skipo framework
        uses: actions/checkout@v4
        with:
          repository: dinilmusick/Skipo
          path: .skipo-framework
      - name: Setup Node
        if: inputs.operation == 'test'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application dependencies
        if: inputs.operation == 'test'
        run: |
          if [ -f pnpm-lock.yaml ] || grep -q '"packageManager": "pnpm@' package.json 2>/dev/null; then
            corepack enable
            pnpm install --no-frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable || yarn install
          else
            npm install
          fi
      - name: Run Skipo operation
        env:
          SKIPO_OPERATION: \${{ inputs.operation }}
        run: |
          python3 .skipo-framework/scripts/skipo_cli.py "$SKIPO_OPERATION" "$GITHUB_WORKSPACE"
      - name: Commit Skipo changes
        if: inputs.operation == 'fix' || inputs.operation == 'update'
        run: |
          git config user.name "skipo-framework[bot]"
          git config user.email "skipo-framework[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(skipo): apply framework \${SKIPO_OPERATION}"
          git push
