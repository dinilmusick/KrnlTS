name: Architecture Boundary
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
      - run: pnpm run boundary
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-boundary-report
          path: .boundary-report.json
          if-no-files-found: warn
      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('.boundary-report.json') ? fs.readFileSync('.boundary-report.json', 'utf8') : 'boundary report missing';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Architecture Boundary Diagnostic\\n\\n```json\\n' + report + '\\n```'
            });
