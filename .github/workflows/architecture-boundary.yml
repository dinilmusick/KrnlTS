name: Architecture Boundary
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run boundary
      - run: pnpm run boundary:relative
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-boundary-report
          path: |
            .boundary-report.json
            .relative-boundary-report.json
          include-hidden-files: true
          if-no-files-found: error
