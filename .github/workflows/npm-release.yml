name: npm Release

on:
  workflow_run:
    workflows: ["KrnlTS CI"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish to npm (leave false to validate only)"
        required: true
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha)
    name: Test, sync dependencies, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Update npm CLI for OIDC Trusted Publishing
        run: npm install --global npm@latest

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Sync published upstream dependencies
        id: updates
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          if npm view @dinilmusick/gutts version >/dev/null 2>&1; then
            GUT_VERSION="$(npm view @dinilmusick/gutts version)"
            export GUT_VERSION
            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const file = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            const name = '@dinilmusick/gutts';
            pkg.dependencies ??= {};
            if (!pkg.dependencies[name] && !pkg.devDependencies?.[name] && !pkg.optionalDependencies?.[name]) {
              pkg.dependencies[name] = '^' + process.env.GUT_VERSION;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
              console.log('Added public GutTS dependency at ' + pkg.dependencies[name]);
            }
            NODE
          fi
          npx --yes npm-check-updates@latest --upgrade --workspaces --filter '@dinilmusick/gutts,@ultrst-armada/krnl,@ultrst-armada/frnlts,@ultrst-armada/kloks,@ultrst-armada/floks'
          if git diff --quiet -- package.json ':(glob)**/package.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.updates.outputs.changed == 'true'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi

      - name: Build
        if: github.event_name != 'schedule' || steps.updates.outputs.changed == 'true'
        run: pnpm run build

      - name: Typecheck
        if: github.event_name != 'schedule' || steps.updates.outputs.changed == 'true'
        run: pnpm run typecheck

      - name: Test
        if: github.event_name != 'schedule' || steps.updates.outputs.changed == 'true'
        run: pnpm run test

      - name: Inspect package contents
        if: github.event_name != 'schedule' || steps.updates.outputs.changed == 'true'
        run: npm pack --dry-run

      - name: Bump patch version when this version was already published
        if: github.event_name == 'workflow_run' || (github.event_name == 'schedule' && steps.updates.outputs.changed == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            npm version patch --no-git-tag-version
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): sync dependencies and bump package version [skip ci]"
            git push origin HEAD:main
          fi

      - name: Validate package metadata
        id: package
        if: github.event_name != 'schedule' || steps.updates.outputs.changed == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.private) throw new Error('Refusing to publish: package.json has private=true');
          if (!p.name || !p.version) throw new Error('package.json must define name and version');
          if (!p.publishConfig || p.publishConfig.registry !== 'https://registry.npmjs.org/') {
            throw new Error('Expected publishConfig.registry to be https://registry.npmjs.org/');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'name=' + p.name + '\nversion=' + p.version + '\n');
          console.log('Validated ' + p.name + '@' + p.version);
          NODE

      - name: Check whether this version is already published
        id: registry
        if: github.event_name != 'schedule' || steps.updates.outputs.changed == 'true'
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already on npm; publish will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm using Trusted Publishing
        if: (github.event_name == 'workflow_run' || github.event_name == 'release' || (github.event_name == 'schedule' && steps.updates.outputs.changed == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish)) && steps.registry.outputs.exists == 'false'
        run: npm publish --access public
      - name: Notify Skipo after successful upstream publication
        if: success() && steps.registry.outputs.exists == 'false' && (github.event_name == 'workflow_run' || github.event_name == 'release' || (github.event_name == 'schedule' && steps.updates.outputs.changed == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish))
        env:
          SYNC_TOKEN: ${{ secrets.ECOSYSTEM_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "ECOSYSTEM_SYNC_TOKEN is not configured; the scheduled dependency-sync fallback remains active."
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const response = await fetch('https://api.github.com/repos/dinilmusick/Skipo/dispatches', {
            method: 'POST',
            headers: {
              Authorization: 'Bearer ' + process.env.SYNC_TOKEN,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              event_type: 'upstream-package-published',
              client_payload: {
                package: pkg.name,
                version: pkg.version,
                repository: process.env.GITHUB_REPOSITORY,
                commit: process.env.GITHUB_SHA,
              },
            }),
          });
          if (!response.ok) throw new Error('Skipo dispatch failed [' + response.status + ']: ' + await response.text());
          console.log('Notified Skipo about ' + pkg.name + '@' + pkg.version);
          NODE

