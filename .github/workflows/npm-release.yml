name: npm Release

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["GutTS CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish to npm (leave false to validate only)"
        required: true
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm CLI for OIDC Trusted Publishing
        run: npm install --global npm@latest
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Inspect package contents
        run: npm pack --dry-run
      - name: Apply Krusbl changeset version and consume release intent
        id: changeset
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          BUMP=""
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/krusbl-bump"
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const order = { patch: 1, minor: 2, major: 3 };
          let selected = '';
          if (fs.existsSync('.changeset')) {
            for (const file of fs.readdirSync('.changeset').filter(f => f.endsWith('.md') && f !== 'README.md')) {
              const text = fs.readFileSync('.changeset/' + file, 'utf8');
              const front = text.split('---').slice(1, 2)[0] || '';
              const line = front.split('\n').find(value => value.includes(pkg.name));
              const match = line?.match(/:\s*(major|minor|patch)\s*$/);
              if (match && (!selected || order[match[1]] > order[selected])) selected = match[1];
            }
          }
          process.stdout.write(selected);
          NODE
          BUMP="$(cat "$RUNNER_TEMP/krusbl-bump")"
          if [ -n "$BUMP" ]; then
            npm version "$BUMP" --no-git-tag-version
            find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -delete
            git config user.name "github-actions[bot]"
            git add -A package.json pnpm-lock.yaml .changeset
            git commit -m "chore(release): apply Krusbl changeset [skip ci]"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize manifest package version
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const manifestPath = 'gutts.manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (manifest.version !== pkg.version) {
            manifest.version = pkg.version;
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\\n');
            console.log('Synchronized gutts.manifest.json to ' + pkg.version);
          }
          NODE
          if ! git diff --quiet -- gutts.manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gutts.manifest.json
            git commit -m "chore(release): sync manifest version [skip ci]"
            git push origin HEAD:main
          fi

      - name: Validate package metadata
        id: package
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.private) throw new Error('Refusing to publish: package.json has private=true');
          if (!p.name || !p.version) throw new Error('package.json must define name and version');
          if (p.publishConfig?.registry !== 'https://registry.npmjs.org/') throw new Error('Unexpected npm registry');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'name=' + p.name + '\nversion=' + p.version + '\n');
          NODE
      - name: Check whether this version is already published
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Write Krusbl release attestation
        if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && steps.registry.outputs.exists == 'false') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const sourceCommit = process.env.SOURCE_COMMIT;
          if (!/^[0-9a-f]{40}$/i.test(sourceCommit)) throw new Error('Missing immutable source commit for release attestation');
          fs.writeFileSync('.krusbl-release-attestation.json', JSON.stringify({
            schema: 1,
            packageName: pkg.name,
            version: pkg.version,
            sourceCommit,
            releaseWorkflow: process.env.GITHUB_WORKFLOW,
            workflowRunId: process.env.GITHUB_RUN_ID,
          }, null, 2) + '\n');
          NODE

      - name: Publish to npm using Trusted Publishing
        if: (github.event_name == 'workflow_run' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && steps.registry.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          set -euo pipefail
          npm publish --access public
      - name: Notify Skipo after successful upstream publication
        if: success() && steps.registry.outputs.exists == 'false' && (github.event_name == 'workflow_run' || github.event_name == 'release' || (github.event_name == 'schedule' && steps.updates.outputs.changed == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish))
        env:
          SYNC_TOKEN: ${{ secrets.ECOSYSTEM_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "ECOSYSTEM_SYNC_TOKEN is not configured; the scheduled dependency-sync fallback remains active."
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const response = await fetch('https://api.github.com/repos/dinilmusick/Skipo/dispatches', {
            method: 'POST',
            headers: {
              Authorization: 'Bearer ' + process.env.SYNC_TOKEN,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              event_type: 'upstream-package-published',
              client_payload: {
                package: pkg.name,
                version: pkg.version,
                repository: process.env.GITHUB_REPOSITORY,
                commit: process.env.GITHUB_SHA,
              },
            }),
          });
          if (!response.ok) throw new Error('Skipo dispatch failed [' + response.status + ']: ' + await response.text());
          console.log('Notified Skipo about ' + pkg.name + '@' + pkg.version);
          NODE

