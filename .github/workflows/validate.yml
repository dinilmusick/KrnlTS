name: Validate Architecture & Types
on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:ecosystem-package-chain
      - run: npm run validate:api
      - run: npm run typecheck
      - run: node scripts/verify-build-boundary.cjs
