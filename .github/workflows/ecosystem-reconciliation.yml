name: Ecosystem Reconciliation Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-reconciliation:
    if: startsWith(github.event.pull_request.head.ref, 'krusbl/reconcile-ecosystem-') && (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconciliation state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merged && 'main' || github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install pytest
      - name: Verify reconciled dependency state
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const packages = ['@ultrst-armada/kloks', '@ultrst-armada/floks'];
          const groups = ['dependencies', 'devDependencies', 'optionalDependencies'];
          const local = [];
          for (const name of packages) {
            for (const group of groups) {
              const spec = pkg[group]?.[name];
              if (typeof spec === 'string' && /^file:/i.test(spec)) local.push(name + '=' + spec);
            }
          }
          if (local.length) throw new Error('Local library dependencies remain: ' + local.join(', '));
          if (fs.existsSync('.skipo/ecosystem.json')) throw new Error('.skipo/ecosystem.json must be removed by reconciliation');
          if (!['pnpm-lock.yaml', 'package-lock.json', 'yarn.lock'].some(fs.existsSync)) {
            throw new Error('No package-manager lockfile is present');
          }
          console.log('Reconciled package dependencies, session-state removal, and lockfile are verified.');
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Record lifecycle result
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        run: |
          {
            echo "## Ecosystem reconciliation completed"
            echo ""
            echo "- Session branch: ${{ github.event.pull_request.head.ref }}"
            echo "- Reconciliation PR: #${{ github.event.pull_request.number }}"
            echo "- Merge commit: ${{ github.event.pull_request.merge_commit_sha }}"
            echo "- Dependency manifest, lockfile, tests, typecheck, and build verified."
          } >> "$GITHUB_STEP_SUMMARY"
