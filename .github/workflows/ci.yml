name: KrnlTS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ultrst-armada/krnl-cli... run build
      - run: pnpm --filter @ultrst-armada/krnl-cli run typecheck
      - run: pnpm --filter @ultrst-armada/krnl-cli run test
      - run: pnpm --filter @ultrst-armada/krnl-core run typecheck
      - run: pnpm --filter @ultrst-armada/krnl-core run test
