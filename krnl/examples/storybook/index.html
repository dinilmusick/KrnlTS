<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krnl Storybook (vNext)</title>
  <style>
    :root {
      --bg: #090b10;
      --panel: #121722;
      --text: #e6f1ff;
      --accent: #32d0ff;
      --muted: #a8b9d8;
      --danger: #ff5f7a;
      --ok: #5cff95;
    }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    .sidebar { background: var(--panel); border-right: 1px solid #23304a; padding: 16px; }
    .brand { font-weight: 800; font-size: 1.2rem; color: var(--accent); margin-bottom: 6px; }
    .hint { color: var(--muted); font-size: .9rem; margin-bottom: 18px; }
    .chapters button {
      width: 100%; text-align: left; margin-bottom: 8px; padding: 10px 12px;
      background: #1a2233; color: var(--text); border: 1px solid #2e3b56; border-radius: 10px; cursor: pointer;
    }
    .chapters button.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .main { padding: 18px; display: grid; gap: 16px; grid-template-rows: auto auto 1fr; }
    .card { background: var(--panel); border: 1px solid #2a3a58; border-radius: 12px; padding: 14px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    input, button { padding: 8px 10px; border-radius: 8px; border: 1px solid #35435f; background: #0f1522; color: var(--text); }
    button { background: #182338; cursor: pointer; }
    .log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; background: #0a0f18; border: 1px solid #2a3a58; border-radius: 8px; padding: 10px; min-height: 84px; color: var(--ok); }
    iframe { width: 100%; min-height: 520px; border: 1px solid #2a3a58; border-radius: 10px; background: #fff; }
    .small { color: var(--muted); font-size: .85rem; }
    .danger { color: var(--danger); }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Krnl Storybook</div>
      <div class="hint">Interactive docs + all exhibits in one site.</div>
      <div class="chapters" id="chapters"></div>
    </aside>

    <main class="main">
      <section class="card">
        <h2>vNext playground (Local + Remote)</h2>
        <div class="row">
          <input id="payload" value="hello-krnl" />
          <button id="run-local">Run Local</button>
          <button id="run-remote">Run Remote Proxy</button>
        </div>
        <p class="small">Remote call instantiates target entity and executes a <strong>local</strong> functionality only.</p>
        <div id="play-log" class="log">Ready.</div>
      </section>

      <section class="card row">
        <strong id="exhibit-title">Exhibit 0</strong>
        <button id="open-tab">Open in new tab</button>
        <span class="small">Use this embedded frame for live examples.</span>
      </section>

      <section class="card">
        <iframe id="exhibit-frame" src="../exhibit0/index.html"></iframe>
      </section>
    </main>
  </div>

  <script type="module">
    import { krnlEntityBase, krnlLocalFunctionality, krnlRemoteFunctionality, krnlEmitter } from "../../core/index.js";

    const chapters = [
      { id: 0, title: "Exhibit 0 · Function Atoms", path: "../exhibit0/index.html" },
      { id: 1, title: "Exhibit 1 · Data Alchemy", path: "../exhibit1/index.html" },
      { id: 2, title: "Exhibit 2 · Error Model", path: "../exhibit2/index.html" },
      { id: 3, title: "Exhibit 3 · State Manager", path: "../exhibit3/index.html" },
      { id: 4, title: "Exhibit 4 · Entity Hierarchy", path: "../exhibit4/index.html" },
      { id: 5, title: "Exhibit 5 · Returned Functions", path: "../exhibit5/index.html" },
      { id: 6, title: "Exhibit 6 · Broadcast", path: "../exhibit6/index.html" },
      { id: 7, title: "Exhibit 7 · Orchestration", path: "../exhibit7/index.html" }
    ];

    const chaptersEl = document.getElementById("chapters");
    const frame = document.getElementById("exhibit-frame");
    const exhibitTitle = document.getElementById("exhibit-title");
    const openTabBtn = document.getElementById("open-tab");
    let active = chapters[0];

    function setActive(chapter) {
      active = chapter;
      frame.src = chapter.path;
      exhibitTitle.textContent = chapter.title;
      openTabBtn.onclick = () => window.open(chapter.path, "_blank");
      [...chaptersEl.querySelectorAll("button")].forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.id) === chapter.id);
      });
    }

    chapters.forEach((chapter) => {
      const button = document.createElement("button");
      button.textContent = chapter.title;
      button.dataset.id = String(chapter.id);
      button.onclick = () => setActive(chapter);
      chaptersEl.appendChild(button);
    });
    setActive(chapters[0]);

    const mathEntityFactory = () => {
      const emitter = new krnlEmitter();
      const multiply = new krnlLocalFunctionality({
        id: "multiplyByTwo",
        state: { invocations: 0 },
        emitters: { default: emitter },
        api: (input, ctx) => {
          ctx.state.invocations += 1;
          const output = String(input).toUpperCase();
          ctx.emitters.get("default").pushDataStreamToEmitter({ output, invocations: ctx.state.invocations });
          return { output, invocations: ctx.state.invocations };
        },
      });

      return new krnlEntityBase({ id: "MathEntity", localFunctionalities: [multiply] });
    };

    const gateway = new krnlEntityBase({
      id: "Gateway",
      remoteFunctionalities: [
        new krnlRemoteFunctionality({
          id: "remoteMultiply",
          target: { entity: mathEntityFactory, functionality: "multiplyByTwo" },
        }),
      ],
    });

    const log = document.getElementById("play-log");
    document.getElementById("run-local").onclick = async () => {
      const payload = document.getElementById("payload").value;
      const entity = mathEntityFactory();
      const result = await entity.call("multiplyByTwo", payload);
      log.textContent = `[LOCAL]\n${JSON.stringify(result, null, 2)}`;
    };

    document.getElementById("run-remote").onclick = async () => {
      try {
        const payload = document.getElementById("payload").value;
        const result = await gateway.call("remoteMultiply", payload);
        log.textContent = `[REMOTE PROXY]\n${JSON.stringify(result, null, 2)}`;
      } catch (error) {
        log.innerHTML = `<span class="danger">${error.message}</span>`;
      }
    };
  </script>
</body>
</html>
