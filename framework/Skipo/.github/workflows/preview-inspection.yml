name: Skipo Real Application Browser Inspection

on:
  workflow_call:
    inputs:
      repository:
        description: Forge application repository to build and inspect
        required: true
        type: string
      ref:
        description: Branch or commit SHA to inspect
        required: true
        type: string
      manifest_path:
        description: App-relative Skipo browser inspection manifest
        required: true
        type: string
      preview_url:
        description: Optional deployed preview URL; when empty, start the checked-out app on the runner
        required: false
        type: string
  workflow_dispatch:
    inputs:
      repository:
        description: Forge application repository to build and inspect
        required: true
        type: choice
        options:
          - dinilmusick/Kult-Engine
          - dinilmusick/Theta-Engine
          - dinilmusick/Kelt-Engine
          - dinilmusick/Krusbl-Engine
      ref:
        description: Branch or commit SHA to inspect
        required: true
        default: main
        type: string
      manifest_path:
        description: App-relative Skipo browser inspection manifest
        required: true
        default: skipo.browser-inspection.json
        type: string
      preview_url:
        description: Optional deployed preview URL; when empty, build and serve the checked-out app on the runner
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect-application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dinilmusick/Skipo
          ref: main
          path: skipo

      - name: Validate target repository and manifest path
        env:
          APP_REPOSITORY: ${{ inputs.repository }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          set -euo pipefail
          case "$APP_REPOSITORY" in
            dinilmusick/Kult-Engine|dinilmusick/Theta-Engine|dinilmusick/Kelt-Engine|dinilmusick/Krusbl-Engine) ;;
            *) echo "Repository is not an approved Forge app."; exit 1 ;;
          esac
          case "$MANIFEST_PATH" in
            ""|/*|*..*) echo "Manifest path must be a safe app-relative path."; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: app

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install and build the actual application
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build

      - name: Install isolated Playwright runtime
        run: npm install --prefix /tmp/skipo-playwright --no-save playwright@1.58.2

      - name: Install Chromium
        run: /tmp/skipo-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Start local app preview when no deployment URL was supplied
        id: preview
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        working-directory: app
        run: |
          set -euo pipefail
          if [[ -n "$PREVIEW_URL" ]]; then
            printf 'url=%s\n' "$PREVIEW_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PORT=3000 NODE_ENV=production nohup pnpm start > "$RUNNER_TEMP/app-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/app-server.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              printf 'url=%s\n' 'http://127.0.0.1:3000' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/app-server.log"
          echo "Application did not become healthy within 120 seconds."
          exit 1

      - name: Inspect actual application routes and viewports
        working-directory: skipo
        env:
          NODE_PATH: /tmp/skipo-playwright/node_modules
          SKIPO_APP_ROOT: ${{ github.workspace }}/app
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          set -euo pipefail
          node scripts/inspect_preview.mjs \
            --url "$PREVIEW_URL" \
            --manifest "$SKIPO_APP_ROOT/$MANIFEST_PATH" \
            --output artifacts/browser-inspection

      - name: Upload browser diagnostics and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-application-browser-inspection
          path: |
            skipo/artifacts/browser-inspection/
            ${{ runner.temp }}/app-server.log
          if-no-files-found: warn
          retention-days: 14
